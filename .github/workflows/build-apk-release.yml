name: Build & Release APK

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - '.github/workflows/build-apk-release.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 0.6.18-beta)'
        required: false

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
  JAVA_VERSION: '17'

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Release APK

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Validate Gradle wrapper
        run: gradle wrapper --validate-only

      - name: Calculate version
        id: version
        run: |
          CURRENT_VERSION=$(grep "versionCode = " app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          NEW_VERSION=$((CURRENT_VERSION + 1))
          VERSION_NAME="${{ inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="0.6.18-beta"
          fi
          echo "version_code=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Decode signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            mkdir -p ..
            echo "$SIGNING_KEY_BASE64" | base64 --decode > ../nuviotv.jks
          fi

      - name: Build full Release APK
        env:
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS || 'nuviotv' }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          CI_USE_DEBUG_SIGNING: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD == '' && 'true' || 'false' }}
        run: |
          ./gradlew assembleFullRelease -x baselineProfileGeneration

      - name: Build playstore Release APK
        env:
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS || 'nuviotv' }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          CI_USE_DEBUG_SIGNING: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD == '' && 'true' || 'false' }}
        run: |
          ./gradlew assemblePlaystoreRelease -x baselineProfileGeneration

      - name: Find APK files
        id: apks
        run: |
          FULL_APK=$(find app/build/outputs/apk/full/release -name "*.apk" -type f | head -1)
          PLAYSTORE_APK=$(find app/build/outputs/apk/playstore/release -name "*.apk" -type f | head -1)
          echo "full_apk=$FULL_APK" >> $GITHUB_OUTPUT
          echo "playstore_apk=$PLAYSTORE_APK" >> $GITHUB_OUTPUT
          ls -lh app/build/outputs/apk/*/release/ || echo "No APKs found"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-builds
          path: |
            app/build/outputs/apk/full/release/*.apk
            app/build/outputs/apk/playstore/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apks.outputs.full_apk }}
            ${{ steps.apks.outputs.playstore_apk }}
          tag_name: v${{ steps.version.outputs.version_name }}
          name: NuvioTV ${{ steps.version.outputs.version_name }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version_name, 'beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to S3 (optional)
        if: secrets.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws s3 cp ${{ steps.apks.outputs.full_apk }} s3://$S3_BUCKET/releases/
          aws s3 cp ${{ steps.apks.outputs.playstore_apk }} s3://$S3_BUCKET/releases/

      - name: Print build summary
        if: always()
        run: |
          echo "## Build Summary"
          echo "Version Code: ${{ steps.version.outputs.version_code }}"
          echo "Version Name: ${{ steps.version.outputs.version_name }}"
          echo "Full APK: ${{ steps.apks.outputs.full_apk }}"
          echo "PlayStore APK: ${{ steps.apks.outputs.playstore_apk }}"

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Notify on Slack
        if: secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "NuvioTV APK Build ${{ needs.build.result }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "NuvioTV APK Build: *${{ needs.build.result }}*\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`"
                  }
                }
              ]
            }
